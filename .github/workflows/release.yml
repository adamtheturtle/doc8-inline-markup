---
name: Release

on:
  push:
    tags: ['[0-9]*']

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Build and check distributions
        run: |
          uv build
          uv run --group=release check-wheel-contents dist/*.whl
          uv run --group=release twine check --strict dist/*

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

      - name: Create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/*

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/doc8-inline-markup/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
